<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>剪易 · 拼图与表情包</title><link rel="stylesheet" href="style.css?v=workspaces-v7"><script src="layout.js?v=workspaces-v7" defer></script><script src="app.js?v=workspaces-v7" defer></script><script src="workspace.js?v=workspaces-v7" defer></script></head>
<body>
<header><a href="../index.html">✂ 剪易</a><nav class="workspace-tabs" aria-label="工作台"><button data-workspace="collage" aria-pressed="true">拼图</button><button data-workspace="meme" aria-pressed="false">表情包</button></nav><button id="drafts">草稿</button><button id="save-draft">保存草稿</button><button id="export" class="primary" disabled>导出 PNG ↗</button></header>
<main>
<aside>
<div class="section-title"><h1>把喜欢的，拼在一起。</h1><p>图片在本机处理，无需上传。</p></div>
<label class="import primary" for="files">＋ 添加图片<input id="files" type="file" accept="image/*" multiple></label>
<p class="hint" id="import-hint">最多 9 张 · 可拖入图片 · GIF 使用静态帧</p><p class="hint">草稿保存在当前浏览器；刷新前请先保存。</p>
<div id="images" class="images" aria-label="已导入图片"></div>
<section id="layout-settings"><h2>布局</h2><div id="layouts" class="layouts" role="group" aria-label="拼图布局"><button id="preset-single" aria-pressed="false" title="单格、无留白、无圆角">▣ 单图</button><button data-layout="grid" aria-pressed="false">▦ 网格</button><button data-layout="hero" aria-pressed="false">▣ 主图</button><button data-layout="rows" aria-pressed="false">☰ 纵向</button><button data-layout="columns" aria-pressed="false">▥ 横向</button><button id="preset-1222" aria-pressed="true" title="四行：1、2、2、2 列">▦ 1:2:2:2</button><button data-layout="custom" aria-pressed="false">▦ 自定义网格</button></div><div id="custom-grid" hidden><label>行数<select id="grid-rows" aria-label="网格行数"></select></label><div id="row-columns" aria-label="每行列数"></div><p class="hint" id="grid-info"></p></div></section>
<section class="settings"><h2>画布</h2><label>比例<select id="ratio"><option value="original">原图比例</option><option value="1">1:1 · 方形</option><option value="1.3333333333">4:3 · 横版</option><option value="0.75">3:4 · 竖版</option><option value="1.7777777778">16:9 · 宽屏</option><option value="0.5625" selected>9:16 · 长图</option></select></label><label class="collage-only">留白 <output id="gap-value">16</output><input id="gap" aria-label="留白" type="range" min="0" max="60" value="16"></label><label class="collage-only">圆角 <output id="radius-value">12</output><input id="radius" aria-label="圆角" type="range" min="0" max="80" value="12"></label><label>背景<input id="background" type="color" value="#f5f3ec"></label><label>导出长边<select id="size"><option value="1200">1200 px</option><option value="2400" selected>2400 px</option><option value="3600">3600 px</option></select></label></section>
<section id="selected" hidden><h2 id="selected-title">图片调整</h2><label>填充方式<select id="fit"><option value="cover">铺满 · 裁切边缘</option><option value="contain">完整显示</option></select></label><button id="reset">居中复位</button><p class="hint">切换“调整裁切”后拖动，调整图片显示位置。</p></section>
<section class="settings" id="text-settings"><h2>文字</h2><div class="meme-only text-actions"><button data-caption="12">顶部大字</button><button data-caption="88">底部配文</button></div><div class="text-actions"><button id="add-text">＋ 添加文字</button><button id="delete-text" disabled>删除选中</button></div><div id="text-list" aria-label="文字列表"></div><label for="text-content">文字内容</label><textarea id="text-content" maxlength="200" rows="3" placeholder="输入标题，可换行"></textarea><label>字号<input id="text-size" type="range" min="12" max="160" value="48" aria-label="文字字号"></label><label>文字颜色<input id="text-color" type="color" value="#ffffff"></label><label>水平位置<input id="text-x" type="range" min="0" max="100" value="50" aria-label="文字水平位置"></label><label>垂直位置<input id="text-y" type="range" min="0" max="100" value="50" aria-label="文字垂直位置"></label><p class="hint">最多 200 字、10 行。预览选择“移动文字”后拖动，每段独立编辑，可从列表或预览选择。</p></section></aside>
<div class="workspace" id="dropzone"><div class="interaction-tools" role="group" aria-label="拖动模式"><button id="undo" disabled aria-label="撤销">↶ 撤销</button><button id="redo" disabled aria-label="重做">↷ 重做</button><button id="expand" aria-pressed="false">放大预览 ⛶</button><button data-interaction="text" aria-pressed="false">移动文字</button><button data-interaction="swap" aria-pressed="true">移动图片</button><button data-interaction="crop" aria-pressed="false">调整裁切</button><span id="interaction-hint">拖到另一张图片上松开，互换位置</span></div><div class="preview-heading"><span>实时预览</span><span id="dimensions">2400 × 2400</span></div><div class="stage"><div id="empty"><span>▧</span><h2>从几张照片开始</h2><p>拖入图片，或点击“添加图片”</p></div><canvas id="canvas" width="900" height="900" tabindex="0" aria-label="拼图预览，拖动或方向键移动图片；裁切模式下调整显示位置" hidden></canvas></div><div class="preview-footer"><span id="status" role="status">准备好你的照片</span><span>方向键：移动模式互换 · 裁切模式微调</span></div></div>
</main>
<dialog id="draft-dialog" aria-labelledby="draft-heading"><div class="draft-heading"><h2 id="draft-heading">我的草稿</h2><button id="close-drafts" aria-label="关闭草稿">×</button></div><label>作品名称<input id="draft-name" type="text" maxlength="80" value="未命名拼图"></label><div class="draft-actions"><button id="draft-save-current">保存当前作品</button><button id="draft-save-copy">另存新草稿</button></div><p id="draft-message" role="status"></p><div id="draft-list"></div><p class="hint">图片随草稿保存在当前浏览器。清理网站数据会删除草稿，不会跨设备同步。</p></dialog></body></html>
